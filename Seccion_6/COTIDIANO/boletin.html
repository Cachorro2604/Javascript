<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Calificaciones</title>
    <link rel="stylesheet" href="misEstilos.css">
    <script src="boletin.js"></script>
</head>

<body onload="listarNotas()">

    <div class="contenedor">
        <h1>BIENVENIDO A TU BOLETÍN ESTUDIANTIL</h1>
        <h4><strong>Alumno:</strong> <span style="font-weight: normal;">Fabricio Villegas</span></h4>

        <div>
            <h4>Notas:</h4>
            <ul id="mi-lista"></ul>
        </div>

        <div>
            <h4>Promedio: <span class="resultado" id="res-promedio"></span></h4>
            <button onclick="calcularPromedio()">Calcular Promedio</button>
        </div>

        <div>
            <h4>Nota más alta: <span class="resultado" id="res-alta"></span></h4>
            <button onclick="notaMasAlta()">Buscar nota más alta</button>
        </div>

        <div>
            <h4>Hay algún aplazo?: <span class="resultado" id="res-aplazado"></span></h4>
            <button onclick="hayAplazados()">Consultar Aplazo</button>
        </div>

    </div>

</body>
</html>
