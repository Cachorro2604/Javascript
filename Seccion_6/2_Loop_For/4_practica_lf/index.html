
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pratica 4</title>
</head>



<body>
    <h3>Tablas de Multiplicar</h3>

    <input type="number" id="numeroTabla">
   
    <button onclick="testLoop()">Tabla</button>
    
    <div id="resultadoTabla"></div>

    

    <script>

        function testLoop(){
            var numero = document.getElementById("numeroTabla").value;
            var contenido = "";
            
            for (var j = 1; j <= 10; j++){
                contenido += numero + " X " + j + " = " + (numero * j) + "<br>";
            }
            
            document.getElementById("resultadoTabla").innerHTML = contenido;
        }
    </script>
</body>
</html>
