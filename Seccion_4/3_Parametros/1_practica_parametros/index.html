<!DOCTYPE html>
<html>
<head>
    <title>Parámetros 1</title>
</head>
<body>
    <p>
        <button onclick="suma(5, 3)">Click aquí</button>
    </p>




    <script>
      
        function suma(num1, num2) {
            let resultado = num1 + num2;
            alert("El resultado es: " + resultado);
        }
    </script>
