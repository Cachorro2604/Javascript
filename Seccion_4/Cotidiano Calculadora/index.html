<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CALCULADORA</title>
    <link rel="stylesheet" href="misEstilos.css">
</head>

<body>

<div class="calculadora">
    <h1>CALCULADORA</h1>

    
    <input type="text" id="num1">
    <input type="text" id="num2">

   
    <div class="operaciones">
        <button onclick="sumarNumero()">+</button>
        <button onclick="restarNumero()">-</button>
        <button onclick="multiplicarNumero()">x</button>
        <button onclick="dividirNumero()">/</button>
        <button onclick="raizNumero()">Raiz</button>
        <button onclick="potenciaNumero()">Potencia</button>
        <button onclick="absolutoNumero()">Absoluto</button>
        <button onclick="randomNumero()">Random</button>
    </div>

    <h2>Resultado:</h2>

    <input type="text" id="resultado" readonly placeholder="0"> 

    
    <div class="redondeo">
        <button onclick="roundNumero()">Round</button>
        <button onclick="floorNumero()">Floor</button>
        <button onclick="ceilNumero()">Ceil</button>
    </div>
</div>

<script>
function sumarNumero() {
    let num1 = Number(document.getElementById("num1").value);
    let num2 = Number(document.getElementById("num2").value);
    let resultado = num1 + num2;
    document.getElementById("resultado").value = resultado;

}

function restarNumero() {
    let num1 = Number(document.getElementById("num1").value);
    let num2 = Number(document.getElementById("num2").value);
    let resultado = num1 - num2;
    document.getElementById("resultado").value = resultado;
}

function multiplicarNumero() {
    let num1 = Number(document.getElementById("num1").value);
    let num2 = Number(document.getElementById("num2").value);
    let resultado = num1 * num2;
    document.getElementById("resultado").value = resultado;
}

function dividirNumero() {
    let num1 = Number(document.getElementById("num1").value);
    let num2 = Number(document.getElementById("num2").value);
    if (num2 == 0) {
        document.getElementById("resultado").value = "No se puedek ";
    } else {
        let resultado = num1 / num2;
        document.getElementById("resultado").value = resultado;
    }
}

function raizNumero() {
    let num1 = Number(document.getElementById("num1").value);
    let resultado = Math.sqrt(num1);
    document.getElementById("resultado").value = resultado;
}



function potenciaNumero() {
    let num1 = Number(document.getElementById("num1").value);
    let num2 = Number(document.getElementById("num2").value);
    let resultado = Math.pow(num1, num2);
    document.getElementById("resultado").value = resultado;
}



           h


function absolutoNumero() {
    let num1 = Number(document.getElementById("num1").value);
    let resultado = Math.abs(num1);
    document.getElementById("resultado").value = resultado;
}

function randomNumero() {
    let resultado = Math.random();
    document.getElementById("resultado").value = resultado;
}



function roundNumero() {
    let resultado = Number(document.getElementById("resultado").value);
    let redondeado = Math.round(resultado);
    document.getElementById("resultado").value = redondeado;
}

function floorNumero() {
    let resultado = Number(document.getElementById("resultado").value);
    let redondeado = Math.floor(resultado);
    document.getElementById("resultado").value = redondeado;
}

function ceilNumero() {
    let resultado = Number(document.getElementById("resultado").value);
    let redondeado = Math.ceil(resultado);
    document.getElementById("resultado").value = redondeado;
}


</script>
</body>
